<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <!-- Ring Gradient -->
    <linearGradient id="ring-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="17%" stop-color="#06B6D4"/>
      <stop offset="33%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="67%" stop-color="#F97316"/>
      <stop offset="83%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Fin Gradient (Orange to Pink to Purple) -->
    <linearGradient id="fin-gradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="87%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- tutto Gradient (Blue to Purple to Pink) -->
    <linearGradient id="tutto-gradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="87%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background (optional - remove for transparent) -->
  <!-- <rect width="400" height="120" fill="white"/> -->

  <!-- Circle Ring -->
  <circle cx="60" cy="60" r="43" fill="none" stroke="url(#ring-gradient)" stroke-width="14"/>

  <!-- Segment Lines (6 divisions) -->
  <g stroke="white" stroke-width="2" opacity="0.4">
    <line x1="60" y1="25" x2="60" y2="9"/>
    <line x1="90.3" y1="42.5" x2="104.1" y2="34.5"/>
    <line x1="90.3" y1="77.5" x2="104.1" y2="85.5"/>
    <line x1="60" y1="95" x2="60" y2="111"/>
    <line x1="29.7" y1="77.5" x2="15.9" y2="85.5"/>
    <line x1="29.7" y1="42.5" x2="15.9" y2="34.5"/>
  </g>

  <!-- Inner Circle (white background for "Fin") -->
  <circle cx="60" cy="60" r="30" fill="white"/>

  <!-- "Fin" Text -->
  <text x="60" y="70" text-anchor="middle" font-size="28" font-weight="400" fill="url(#fin-gradient)" font-family="Georgia, serif" letter-spacing="-0.5">Fin</text>

  <!-- "tutto" Text -->
  <text x="130" y="72" font-size="42" font-weight="400" fill="url(#tutto-gradient)" font-family="Georgia, serif" letter-spacing="-1">tutto</text>

  <!-- Claim -->
  <text x="130" y="95" font-size="11" font-weight="400" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.3">alles. automatisch. ab jetzt.</text>
</svg>
