<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="17%" stop-color="#06B6D4"/>
      <stop offset="33%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="67%" stop-color="#F97316"/>
      <stop offset="83%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Fin Gradient -->
    <linearGradient id="fin-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="87%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- tutto Gradient -->
    <linearGradient id="tutto-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="87%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Circle Ring -->
  <circle cx="100" cy="75" r="55" fill="none" stroke="url(#ring-grad)" stroke-width="16"/>

  <!-- Segment Lines -->
  <g stroke="white" stroke-width="2.5" opacity="0.4">
    <line x1="100" y1="30" x2="100" y2="6"/>
    <line x1="147.6" y1="47.5" x2="165.3" y2="37.3"/>
    <line x1="147.6" y1="102.5" x2="165.3" y2="112.7"/>
    <line x1="100" y1="120" x2="100" y2="144"/>
    <line x1="52.4" y1="102.5" x2="34.7" y2="112.7"/>
    <line x1="52.4" y1="47.5" x2="34.7" y2="37.3"/>
  </g>

  <!-- Inner Circle -->
  <circle cx="100" cy="75" r="38" fill="white"/>

  <!-- "Fin" Text -->
  <text x="100" y="88" text-anchor="middle" font-size="36" font-weight="400" fill="url(#fin-grad)" font-family="Georgia, serif" letter-spacing="-0.5">Fin</text>

  <!-- "tutto" Text -->
  <text x="100" y="170" text-anchor="middle" font-size="28" font-weight="400" fill="url(#tutto-grad)" font-family="Georgia, serif" letter-spacing="6">tutto</text>
</svg>
